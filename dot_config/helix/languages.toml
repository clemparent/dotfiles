[language-server.sql-language-server]
command = "sql-language-server"
args = ["up", "--method", "stdio"]

[[language]]
name = "sql"
language-servers = [ "sql-language-server" ]
formatter = { command= "sqlfluff lint" }

[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }
language-servers = ["gopls"]

[language-server.gopls.config]
"formatting.gofumpt" = true
"formatting.local" = "github.com/urbn/"
completeUnimported = true

[[language]]
name = "python"
language-servers = [
  {name = "pyright"},
  {name = "ruff"}
  ]

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config.python.analysis]
typeCheckingMode = "off"
extraPaths = ["/home/clem/.cache/pydeps/platform-services-test"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ruff.config.settings]
args = ["--ignore", "E501"]

[language.formatter]
command = "black"
args = ["--line-length", "88", "--quiet", "-"]

[[language]]
name = "groovy"
file-types = ["groovy", "gradle", "Jenkinsfile"]
formatter = { command = "npm-groovy-lint", args = ["--format", "-"] }
auto-format = true
